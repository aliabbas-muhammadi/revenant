[project]
name = "revenant"
version = "0.0.1"
description = "A durability conformance harness: kill an agent at every step boundary and prove deterministic resume and exactly-once side effects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
revenant = "revenant.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
